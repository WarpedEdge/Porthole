name: Build unsigned Porthole IPA
on:
  workflow_dispatch:
  push:
    branches: [feature/arm64-vc-runtime-ci]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build tools
        run: |
          brew install xcodegen cmake ninja pkg-config bison flex mingw-w64 llvm
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          xcodebuild -version
      - name: Test Visual C++ extractor
        run: bash app/Tests/VCRuntime/run.sh
      - name: Prepare project configuration
        run: |
          cp app/Config/Local.xcconfig.example app/Config/Local.xcconfig
          sed -i '' 's/com.example.porthole/com.warpededge.porthole/g' app/Config/Local.xcconfig
      - name: Build native runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo "Building native libraries from the pinned Madeira submodules."
          echo "The upstream SOURCE.md warns that a clean build has not been validated."
          # Madeira's native scripts expect Wine's macOS-generated config.h and
          # generated headers, but a fresh submodule checkout has no build-macos.
          # Validate native toolchain dependencies together before the expensive build.
          for command in bison flex x86_64-w64-mingw32-gcc llvm-objcopy cmake ninja xcodegen; do
            command -v "$command" || { echo "::error::Missing $command"; exit 1; }
          done
          bison --version | head -1
          WINE_SRC="$GITHUB_WORKSPACE/vendor/Madeira/wine"
          mkdir -p "$WINE_SRC/build-macos"
          (
            cd "$WINE_SRC/build-macos"
            ../configure --enable-win64 --disable-tests
          )
          test -s "$WINE_SRC/build-macos/include/config.h" || {
            echo "::error::Wine configure did not generate include/config.h"
            exit 1
          }
          # Wine's configure only creates config.h; the COM/Media Foundation
          # headers required by Madeira's ntdll unixlibs are generated from
          # Wine IDL by widl. Build these headers with Wine's own make rules
          # (which also build the host widl tool) before compiling iOS code.
          WINE_HEADERS=(wtypesbase.h wtypes.h unknwn.h objidlbase.h dwrite.h dwrite_3.h mfobjects.h mftransform.h)
          WINE_TARGETS=()
          for header in "${WINE_HEADERS[@]}"; do
            WINE_TARGETS+=("include/$header")
          done
          make -C "$WINE_SRC/build-macos" -j4 "${WINE_TARGETS[@]}"
          for header in "${WINE_HEADERS[@]}"; do
            test -s "$WINE_SRC/build-macos/include/$header" || {
              echo "::error::Missing generated Wine header $header"
              exit 1
            }
          done
          # The wineserver helper captures clang failures in per-source err-*.txt files.
          # Print them before exiting so failures are diagnosable from Actions logs.
          if ! tools/build_wineserver_base.sh; then
            echo "::group::Wine server compiler diagnostics"
            find vendor/Madeira/build/wineserver -type f -name 'err-*.txt' -print -exec sh -c 'echo "----- $1"; cat "$1"' _ {} \; || true
            echo "::endgroup::"
            exit 1
          fi
          tools/build_dxmt_shader_headers.sh
          tools/apply_dxmt_patch.sh
          tools/build_fex_ios.sh
          # ntdll-unix compiles crypto, font, and media shims against the
          # iOS cross-built headers, so build those dependencies first.
          # iOS SDK 18.5 omits ri_page_wait_time_mach; report zero for this
          # optional diagnostic metric rather than accessing a nonexistent field.
          SERVER_IOS="vendor/Madeira/build/ntdll-unix/server_ios.c"
          python3 - "$SERVER_IOS" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          old = "XP_MS( ru.ri_page_wait_time_mach - pru.ri_page_wait_time_mach )"
          if old not in s:
              raise SystemExit("Unexpected server_ios.c layout; refusing blind patch")
          p.write_text(s.replace(old, "0.0 /* SDK lacks page-wait-time metric */"))
          PY
          # Madeira's freetype-ios script requires a separate source checkout;
          # this tree is not included in the pinned git submodules.
          FREETYPE_SRC="$GITHUB_WORKSPACE/vendor/Madeira/research/freetype"
          if [ ! -f "$FREETYPE_SRC/CMakeLists.txt" ]; then
            mkdir -p "$(dirname "$FREETYPE_SRC")"
            git clone --depth 1 --branch VER-2-13-3 \
              https://github.com/freetype/freetype.git "$FREETYPE_SRC"
          fi
          test -f "$FREETYPE_SRC/include/ft2build.h" || {
            echo "::error::FreeType 2.13.3 headers missing"
            exit 1
          }
          for part in gnutls-ios ffmpeg freetype-ios ntdll-unix win32u-unix wineserver dxmt-ios; do
            script="vendor/Madeira/build/$part/build.sh"
            test -f "$script" || { echo "::error::Missing $script"; exit 1; }
            if ! bash "$script"; then
              echo "::group::Compiler diagnostics for $part"
              find "vendor/Madeira/build/$part" -type f \( -name "err-*.txt" -o -name "*.err" -o -name "*.log" \) -print -exec sh -c 'echo "----- $1"; tail -n 100 "$1"' _ {} \; || true
              echo "::endgroup::"
              exit 1
            fi
          done
          tools/stage_runtime.sh
      - name: Generate Xcode project
        run: cd app && xcodegen generate
      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild -project app/Porthole.xcodeproj -scheme Porthole -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Porthole.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/Porthole-unsigned.ipa" Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: Porthole-unsigned-ipa
          path: Porthole-unsigned.ipa
          if-no-files-found: error
