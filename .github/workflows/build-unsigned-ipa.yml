name: Build unsigned Porthole IPA
on:
  workflow_dispatch:
  push:
    branches: [feature/arm64-vc-runtime-ci]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-arm64
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select Xcode 26 SDK
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test -d /Applications/Xcode_26.3.app/Contents/Developer
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install build tools
        run: |
          brew install xcodegen cmake ninja pkg-config bison flex mingw-w64 llvm
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          xcodebuild -version
      - name: Test Visual C++ extractor
        run: bash app/Tests/VCRuntime/run.sh
      - name: Prepare project configuration
        run: |
          cp app/Config/Local.xcconfig.example app/Config/Local.xcconfig
          sed -i '' 's/com.example.porthole/com.warpededge.porthole/g' app/Config/Local.xcconfig
      # The native runtime is unchanged by Swift/UI edits. Cache its final
      # iOS archives separately so subsequent app builds skip Wine/FEX/DXMT.
      - name: Restore completed iOS native runtime
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            vendor/Madeira/app/Madeira/lib*.a
            vendor/Madeira/build/madeira_cfg.h
          key: native-ios-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vendor/Madeira/.git', 'tools/build_*.sh', 'tools/apply_dxmt_patch.sh', 'patches/*.patch') }}
      - name: Validate restored native runtime
        if: steps.native-cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          for lib in dxmt_combined gmp lzma gnutls hogweed nettle ntdll_unix win32u_unix wineserver avcodec avformat avutil swresample; do
            test -s "vendor/Madeira/app/Madeira/lib${lib}.a" || {
              echo "::error::Cached native library missing: lib${lib}.a"; exit 1;
            }
          done
          test -s vendor/Madeira/build/madeira_cfg.h
      - name: Restore LLVM 15 iOS build cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        id: llvm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            vendor/Madeira/toolchains/llvm-project
            vendor/Madeira/toolchains/llvm-host-build
            vendor/Madeira/toolchains/llvm-ios-build
          key: ${{ runner.os }}-${{ runner.arch }}-llvm15-ios-v1
      - name: Prepare LLVM 15 iOS static libraries
        if: steps.native-cache.outputs.cache-hit != 'true' && steps.llvm-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/vendor/Madeira/toolchains"
          mkdir -p "$ROOT"
          if [ ! -f "$ROOT/llvm-project/llvm/CMakeLists.txt" ]; then
            git clone --depth 1 --branch llvmorg-15.0.7 https://github.com/llvm/llvm-project.git "$ROOT/llvm-project"
          fi
          LLVM="$ROOT/llvm-project/llvm"
          # Madeira's DXMT airconv is tied to LLVM 15 headers and iOS archives.
          cmake -S "$LLVM" -B "$ROOT/llvm-host-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLLVM_ENABLE_PROJECTS="" \
            -DLLVM_TARGETS_TO_BUILD="" -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF
          cmake --build "$ROOT/llvm-host-build" --target llvm-tblgen --parallel 4
          # LLVM 15's AddLLVM.cmake uses ELF linker GC flags for iOS unless
          # iOS is included in the Darwin branch.
          python3 - "$LLVM/cmake/modules/AddLLVM.cmake" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          old = 'MATCHES "Darwin"'
          if old not in s and 'MATCHES "Darwin|iOS"' not in s:
              raise SystemExit("Unexpected LLVM AddLLVM.cmake; refusing blind patch")
          if old in s:
              p.write_text(s.replace(old, 'MATCHES "Darwin|iOS"'))
          PY
          cmake -S "$LLVM" -B "$ROOT/llvm-ios-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=18.0 \
            -DLLVM_TABLEGEN="$ROOT/llvm-host-build/bin/llvm-tblgen" \
            -DLLVM_BUILD_UTILS=OFF -DLLVM_INCLUDE_TOOLS=OFF \
            -DLLVM_BUILD_TOOLS=OFF -DLLVM_TARGETS_TO_BUILD="" \
            -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF -DLLVM_ENABLE_ZSTD=OFF
          cmake --build "$ROOT/llvm-ios-build" --parallel 4
          test -f "$ROOT/llvm-ios-build/include/llvm/Config/llvm-config.h"
          find "$ROOT/llvm-ios-build/lib" -maxdepth 1 -name '*.a' | grep -q .
      - name: Save LLVM 15 iOS build cache
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            vendor/Madeira/toolchains/llvm-project
            vendor/Madeira/toolchains/llvm-host-build
            vendor/Madeira/toolchains/llvm-ios-build
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}
      - name: Patch MetalFX for installed iOS SDK
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          SRC=vendor/Madeira/dxmt/src/winemetal/unix/winemetal_unix.c
          python3 - "$SRC" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          # Frame interpolation is iOS 26-only. The macOS-15 runner's SDK
          # does not declare those types; disable this optional feature at
          # compile time while preserving normal Metal presentation.
          start = s.index('static int madeira_fg_setup(')
          end = s.index('static void madeira_fg_dispatch(', start)
          setup = s[start:end]
          if 'MTLFXFrameInterpolatorDescriptor' not in setup:
              raise SystemExit("Unexpected MetalFX setup layout")
          setup = '#if __IPHONE_OS_VERSION_MAX_ALLOWED >= 260000\n' + setup + '#else\nstatic int madeira_fg_setup(id<MTLDevice> dev, id<MTLTexture> src) { (void)dev; (void)src; return 0; }\n#endif\n'
          s = s[:start] + setup + s[end:]
          # The frame-generation presentation function also refers to the
          # unavailable MetalFX protocol. Stub only this optional path.
          start = s.index('static int madeira_fg_present_inner(')
          end = s.index('static NTSTATUS', start)
          present = s[start:end]
          if 'MTLFXFrameInterpolator' not in present:
              raise SystemExit("Unexpected MetalFX present layout")
          present = '#if __IPHONE_OS_VERSION_MAX_ALLOWED >= 260000\n' + present + '#else\nstatic int madeira_fg_present(id<MTLCommandBuffer> cb, id<CAMetalDrawable> drawable) { (void)cb; (void)drawable; return 0; }\n#endif\n'
          s = s[:start] + present + s[end:]
          p.write_text(s)
          PY
      - name: Build native runtime dependencies
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Building native libraries from the pinned Madeira submodules."
          echo "The upstream SOURCE.md warns that a clean build has not been validated."
          # Madeira's native scripts expect Wine's macOS-generated config.h and
          # generated headers, but a fresh submodule checkout has no build-macos.
          # Validate native toolchain dependencies together before the expensive build.
          for command in bison flex x86_64-w64-mingw32-gcc llvm-objcopy cmake ninja xcodegen; do
            command -v "$command" || { echo "::error::Missing $command"; exit 1; }
          done
          bison --version | head -1
          WINE_SRC="$GITHUB_WORKSPACE/vendor/Madeira/wine"
          mkdir -p "$WINE_SRC/build-macos"
          (
            cd "$WINE_SRC/build-macos"
            ../configure --enable-win64 --disable-tests
          )
          test -s "$WINE_SRC/build-macos/include/config.h" || {
            echo "::error::Wine configure did not generate include/config.h"
            exit 1
          }
          # Wine's configure only creates config.h; the COM/Media Foundation
          # headers required by Madeira's ntdll unixlibs are generated from
          # Wine IDL by widl. Build these headers with Wine's own make rules
          # (which also build the host widl tool) before compiling iOS code.
          # Generate the initial IDL targets, then resolve transitive IDL includes
          # from generated headers AND Wine source headers used by the server.
          # This catches source-only chains such as shlguid.h -> exdisp.h.
          WINE_HEADERS=(wtypesbase.h wtypes.h unknwn.h objidlbase.h objidl.h oaidl.h propidl.h oleidl.h ocidl.h urlmon.h msxml.h servprov.h dxgiformat.h dcommon.h dwrite.h dwrite_1.h dwrite_2.h dwrite_3.h d2d1.h d3d10.h d3d10_1.h d3d11.h d3d12.h control.h amvideo.h strmif.h shobjidl.h mfobjects.h mftransform.h)
          python3 - "$WINE_SRC" "${WINE_HEADERS[@]}" <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import sys

          src = Path(sys.argv[1])
          generated = src / "build-macos/include"
          source_headers = src / "include"
          pending = set(sys.argv[2:])
          completed = set()
          include_pattern = re.compile(r'^\s*#\s*include\s*[<"]([^">]+)[">]', re.M)
          for iteration in range(30):
              batch = sorted(pending - completed)
              if batch:
                  subprocess.run(
                      ["make", "-C", str(src / "build-macos"), "-j4",
                       *(f"include/{name}" for name in batch)], check=True)
                  for name in batch:
                      if not (generated / name).is_file():
                          raise SystemExit(f"Missing generated Wine header: {name}")
                  completed.update(batch)
              discovered = set()
              # Check generated headers and their source-tree dependencies.
              visited = set()
              stack = [generated / name for name in completed]
              # Some generated IDL dependencies are referenced only by
              # ordinary Wine headers, not by another generated header.
              stack.extend([source_headers / "shlguid.h"])
              while stack:
                  file = stack.pop()
                  if file in visited or not file.is_file():
                      continue
                  visited.add(file)
                  for name in include_pattern.findall(file.read_text(errors="replace")):
                      if "/" in name or not name.endswith(".h"):
                          continue
                      generated_header = generated / name
                      source_header = source_headers / name
                      if generated_header.is_file():
                          stack.append(generated_header)
                      elif source_header.is_file():
                          stack.append(source_header)
                      elif (source_headers / (name[:-2] + ".idl")).is_file():
                          discovered.add(name)
              pending.update(discovered)
              if not pending - completed:
                  print(f"Validated {len(completed)} generated Wine headers and transitive includes")
                  break
          else:
              raise SystemExit("Wine IDL header dependency resolution did not converge")
          PY
          # The wineserver helper captures clang failures in per-source err-*.txt files.
          # Print them before exiting so failures are diagnosable from Actions logs.
          if ! tools/build_wineserver_base.sh; then
            echo "::group::Wine server compiler diagnostics"
            find vendor/Madeira/build/wineserver -type f -name 'err-*.txt' -print -exec sh -c 'echo "----- $1"; cat "$1"' _ {} \; || true
            echo "::endgroup::"
            exit 1
          fi
          tools/build_dxmt_shader_headers.sh
          tools/apply_dxmt_patch.sh
          tools/build_fex_ios.sh
          # ntdll-unix compiles crypto, font, and media shims against the
          # iOS cross-built headers, so build those dependencies first.
          # iOS SDK 18.5 omits ri_page_wait_time_mach; report zero for this
          # optional diagnostic metric rather than accessing a nonexistent field.
          SERVER_IOS="vendor/Madeira/build/ntdll-unix/server_ios.c"
          python3 - "$SERVER_IOS" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          old = "XP_MS( ru.ri_page_wait_time_mach - pru.ri_page_wait_time_mach )"
          if old not in s:
              raise SystemExit("Unexpected server_ios.c layout; refusing blind patch")
          p.write_text(s.replace(old, "0.0 /* SDK lacks page-wait-time metric */"))
          PY
          # Madeira's freetype-ios script requires a separate source checkout;
          # this tree is not included in the pinned git submodules.
          FREETYPE_SRC="$GITHUB_WORKSPACE/vendor/Madeira/research/freetype"
          if [ ! -f "$FREETYPE_SRC/CMakeLists.txt" ]; then
            mkdir -p "$(dirname "$FREETYPE_SRC")"
            git clone --depth 1 --branch VER-2-13-3 \
              https://github.com/freetype/freetype.git "$FREETYPE_SRC"
          fi
          test -f "$FREETYPE_SRC/include/ft2build.h" || {
            echo "::error::FreeType 2.13.3 headers missing"
            exit 1
          }
          for part in gnutls-ios ffmpeg freetype-ios ntdll-unix win32u-unix wineserver dxmt-ios; do
            script="vendor/Madeira/build/$part/build.sh"
            test -f "$script" || { echo "::error::Missing $script"; exit 1; }
            if ! bash "$script"; then
              echo "::group::Compiler diagnostics for $part"
              find "vendor/Madeira/build/$part" -type f \( -name "err-*.txt" -o -name "*.err" -o -name "*.log" \) -print -exec sh -c 'echo "----- $1"; tail -n 100 "$1"' _ {} \; || true
              echo "::endgroup::"
              exit 1
            fi
          done
          # DXMT's build.sh emits only libdxmt_unix.a; Xcode links the
          # combined archive containing its objects and LLVM iOS libraries.
          DXMT_BUILD="$GITHUB_WORKSPACE/vendor/Madeira/build/dxmt-ios"
          LLVM_LIB="$GITHUB_WORKSPACE/vendor/Madeira/toolchains/llvm-ios-build/lib"
          test -f "$DXMT_BUILD/libdxmt_unix.a"
          test -d "$DXMT_BUILD/obj"
          test -d "$LLVM_LIB"
          llvm_archives=("$LLVM_LIB"/*.a)
          test -f "${llvm_archives[0]}" || { echo "::error::No LLVM iOS archives"; exit 1; }
          xcrun -sdk iphoneos libtool -static -o "$DXMT_BUILD/libdxmt_combined.a" \
            "$DXMT_BUILD"/obj/*.o "${llvm_archives[@]}"
          cp "$DXMT_BUILD/libdxmt_combined.a" \
            "$GITHUB_WORKSPACE/vendor/Madeira/app/Madeira/libdxmt_combined.a"
          test -s "$GITHUB_WORKSPACE/vendor/Madeira/app/Madeira/libdxmt_combined.a"
      - name: Save completed iOS native runtime
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            vendor/Madeira/app/Madeira/lib*.a
            vendor/Madeira/build/madeira_cfg.h
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Stage native runtime resources
        run: |
          set -euo pipefail
          tools/stage_runtime.sh
          test -s app/RuntimeStage/lib/libdxmt_combined.a
      - name: Prepare StikJIT framework
        run: python3 tools/prepare_stikjit.py
      - name: Stage Madeira configuration header
        run: |
          set -euo pipefail
          mkdir -p build
          cp vendor/Madeira/build/madeira_cfg.h build/madeira_cfg.h
          test -s build/madeira_cfg.h
      - name: Generate Xcode project
        run: cd app && xcodegen generate
      - name: Check DXMT optional symbol compatibility
        run: |
          set -euo pipefail
          LIB="$GITHUB_WORKSPACE/vendor/Madeira/app/Madeira/libdxmt_combined.a"
          test -s "$LIB"
          for symbol in madeira_framegen_get madeira_framegen_set madeira_passprof_start madeira_passprof_dump; do
            if xcrun nm -g "$LIB" | grep -Eq "[[:space:]]_?${symbol}$"; then
              echo "$symbol: provided by DXMT"
            else
              echo "$symbol: optional compatibility fallback required"
            fi
          done
      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild -project app/Porthole.xcodeproj -scheme Porthole -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Porthole.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/Porthole-unsigned.ipa" Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: Porthole-unsigned-ipa
          path: Porthole-unsigned.ipa
          if-no-files-found: error
